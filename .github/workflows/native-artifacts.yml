name: Native migration-os artifacts

on:
  pull_request:
    paths:
      - "plugins/migration-case-manager/apps/migration-os-ui/**"
      - "packages/migration-os/**"
      - ".github/workflows/native-artifacts.yml"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/migration-case-manager/apps/migration-os-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check:contract
      - run: node --test ../../../../packages/migration-os/test/*.test.mjs
      - run: npm pack --dry-run ../../../../packages/migration-os
      - run: sh ../../runtime/test-bootstrap.sh
      - run: bun run build
      - run: bun run build:release -- release
      - run: ./release/migration-os-linux-x64 doctor
      - uses: actions/upload-artifact@v4
        with:
          name: migration-os-native-${{ github.sha }}
          path: plugins/migration-case-manager/apps/migration-os-ui/release/
          if-no-files-found: error

  native-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: migration-os-linux-x64
          - runner: macos-14
            target: bun-darwin-arm64
            artifact: migration-os-darwin-arm64
          - runner: windows-2022
            target: bun-windows-x64
            artifact: migration-os-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: plugins/migration-case-manager/apps/migration-os-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run scripts/build-standalone.ts --target ${{ matrix.target }} --output release/${{ matrix.artifact }}
      - run: bun run scripts/smoke-standalone.ts release/${{ matrix.artifact }}

  publish-preview-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.')
    needs: [build, native-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: migration-os-native-${{ github.sha }}
          path: release
      - name: Verify tag matches npx launcher version
        run: |
          package_version="$(node -p 'require("./packages/migration-os/package.json").version')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Refuse to mutate an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; preview releases are immutable."
            exit 1
          fi
      - name: Create preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "Migration OS $GITHUB_REF_NAME preview" --notes-file docs/preview-release-notes.md

  publish-npm-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.')
    needs: publish-preview-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches npx launcher version
        run: |
          package_version="$(node -p 'require("./packages/migration-os/package.json").version')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - run: node --test packages/migration-os/test/*.test.mjs
      - run: npm pack --dry-run ./packages/migration-os
      - name: Publish with npm trusted publishing
        working-directory: packages/migration-os
        run: npm publish --access public --tag next
