name: Native migration-os artifacts

on:
  pull_request:
    paths:
      - "plugins/migration-case-manager/apps/migration-os-ui/**"
      - ".github/workflows/native-artifacts.yml"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/migration-case-manager/apps/migration-os-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run check:contract
      - run: sh ../../runtime/test-bootstrap.sh
      - run: bun run build
      - run: bun run build:release -- release
      - run: ./release/migration-os-linux-x64 doctor
      - uses: actions/upload-artifact@v4
        with:
          name: migration-os-native-${{ github.sha }}
          path: plugins/migration-case-manager/apps/migration-os-ui/release/
          if-no-files-found: error

  native-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            artifact: migration-os-linux-x64
          - runner: macos-14
            target: bun-darwin-arm64
            artifact: migration-os-darwin-arm64
          - runner: windows-2022
            target: bun-windows-x64
            artifact: migration-os-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: plugins/migration-case-manager/apps/migration-os-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run scripts/build-standalone.ts --target ${{ matrix.target }} --output release/${{ matrix.artifact }}
      - run: bun run scripts/smoke-standalone.ts release/${{ matrix.artifact }}
